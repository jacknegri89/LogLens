name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository: it never needs to write to it.
permissions:
  contents: read

# A new push to the same branch makes the run of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throw-away PostgreSQL for the tests of the hourly limits, which need real concurrent
    # connections (src/repositories/attemptReservation.integration.test.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loglens_test
          POSTGRES_PASSWORD: loglens_test
          POSTGRES_DB: loglens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loglens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (server)
        run: npm run typecheck --prefix server

      - name: Typecheck (client)
        run: npm run typecheck --prefix client

      - name: Lint (client)
        run: npm run lint --prefix client

      - name: Lint (server)
        run: npm run lint --prefix server

      - name: Audit dependencies (root, server, client)
        run: |
          npm audit --audit-level=moderate
          npm audit --audit-level=moderate --prefix server
          npm audit --audit-level=moderate --prefix client

      - name: Create the tables of the test database
        working-directory: server
        run: npx prisma db push
        env:
          DIRECT_URL: postgresql://loglens_test:loglens_test@localhost:5432/loglens_test

      # Unit tests, API integration tests (the app is started on a free port and called over
      # HTTP, with the database replaced by a stand-in), regression tests of the security fixes,
      # the deterministic benchmarks (benchmarks/benchmarks.test.ts fails if the engine gets
      # worse) and the hourly-limit transaction on the real PostgreSQL service above.
      # No test needs a key or the network.
      - name: Test (server)
        run: npm test --prefix server
        env:
          TEST_DATABASE_URL: postgresql://loglens_test:loglens_test@localhost:5432/loglens_test

      - name: Test (client)
        run: npm test --prefix client

      - name: Build (server)
        run: npm run build --prefix server

      - name: Build (client)
        run: npm run build --prefix client

      # The bundle that Vercel serves: the API in one file plus the static client.
      - name: Build (Vercel output)
        run: npm run build:vercel

      - name: Install Chromium for end-to-end tests
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (client)
        run: npm run test:e2e --prefix client
