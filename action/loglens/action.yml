name: 'LogLens analysis'
description: 'Sends a log file to LogLens, writes the report to the job summary and can fail the job on a severity.'
inputs:
  log-path:
    description: 'Path of the log file to analyze. Only its last part is sent when the file is large.'
    required: true
  loglens-token:
    description: 'The INGEST_TOKEN of your LogLens server. Store it as a repository secret.'
    required: true
  endpoint:
    description: 'Ingest URL of the LogLens server.'
    required: false
    default: 'https://loglens-demo.vercel.app/api/ingest'
  fail-on-severity:
    description: 'Fail the job when the severity is at or above low, medium, high or critical. Use none to never fail.'
    required: false
    default: 'none'
outputs:
  severity:
    description: 'Severity of the analysis.'
    value: ${{ steps.send.outputs.severity }}
  id:
    description: 'Id of the analysis on the LogLens server.'
    value: ${{ steps.send.outputs.id }}
runs:
  using: 'composite'
  steps:
    - id: send
      shell: bash
      env:
        LOGLENS_ENDPOINT: ${{ inputs.endpoint }}
        LOGLENS_TOKEN: ${{ inputs.loglens-token }}
        LOG_PATH: ${{ inputs.log-path }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
      run: node "${{ github.action_path }}/send-log.mjs"
